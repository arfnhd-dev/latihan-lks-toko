name: Deploy Laravel App to Docker Swarm

on:
  push:
    branches:
      - Branch_test

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latihan-lks-toko
  SERVICE_NAME: lks-toko_laravel_app
  STACK_NAME: lks-toko
  NETWORK_NAME: lks-toko_presensi_secure_net

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create .env file for testing
        run: |
          cp .env.example .env || echo "APP_ENV=local" > .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          
      - name: Run tests
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_KEY=${{ secrets.APP_KEY }}

      - name: Deploy to Docker Swarm
        run: |
          # 1. Update service di Swarm (Rolling Update)
          docker service update \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --with-registry-auth \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-order start-first \
            ${{ env.SERVICE_NAME }}
          
          # 2. Tunggu sebentar agar service stabil
          sleep 10
          
          # 3. Jalankan migrasi database via task sementara
          docker service create \
            --name ${STACK_NAME}_migration_$(date +%s) \
            --restart-condition none \
            --network ${{ env.NETWORK_NAME }} \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            php artisan migrate --force --no-interaction
          
          # 4. Cek status service
          docker service ps ${{ env.SERVICE_NAME }}

      - name: Verify deployment
        run: |
          # Cek apakah service running
          docker service ps ${{ env.SERVICE_NAME }} --format "table {{.Name}}\t{{.CurrentState}}" | grep -q "Running" || exit 1
          echo "✅ Service is running!"
          
          # Test HTTP
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8080 || echo "⚠️ Cannot access via localhost"
