name: Deploy Laravel App to Docker Swarm

on:
  push:
    branches:
      - Branch_test

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latihan-lks-toko

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Setup testing environment
        run: |
          # Generate APP_KEY untuk testing
          echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" > .env.testing
          echo "APP_ENV=testing" >> .env.testing
          echo "DB_CONNECTION=sqlite" >> .env.testing
          echo "DB_DATABASE=:memory:" >> .env.testing
          echo "CACHE_DRIVER=array" >> .env.testing
          echo "SESSION_DRIVER=array" >> .env.testing
          echo "QUEUE_CONNECTION=sync" >> .env.testing
          echo "MAIL_MAILER=array" >> .env.testing

      - name: Skip migrations and seeders for testing
        run: |
          echo "⏭️ Skipping migrations and seeders for testing"
          # Tidak menjalankan migrate dan seed

      - name: Run tests (skip database tests)
        run: php artisan test --env=testing --exclude-group=database

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy Directly to Docker Swarm Local
        run: |
          # 1. Login ke GHCR langsung di internal VPS 1 agar runner dapat izin download image
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          
          # 2. Jalankan Rolling Update tanpa downtime ke cluster Swarm
          docker service update \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --with-registry-auth \
            lks_toko_stack_lks_toko_app
          
          # 3. Jalankan migrasi database otomatis via One-Off container dengan environment production
          docker service create --name toko_migration_job_$(date +%s) \
            --restart-condition none \
            --network presensievent_presensi_secure_net \
            --env APP_ENV=production \
            --env APP_KEY=${{ secrets.APP_KEY }} \
            --env DB_CONNECTION=mysql \
            --env DB_HOST=172.17.50.58 \
            --env DB_PORT=3306 \
            --env DB_DATABASE=${{ secrets.DB_DATABASE }} \
            --env DB_USERNAME=${{ secrets.DB_USERNAME }} \
            --env DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --env REDIS_HOST=172.17.50.58 \
            --env REDIS_PORT=6379 \
            --env CACHE_DRIVER=redis \
            --env SESSION_DRIVER=redis \
            --env QUEUE_CONNECTION=redis \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            php artisan migrate --force
