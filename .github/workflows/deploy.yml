name: Deploy Laravel App to Docker Swarm

on:
  push:
    branches:
      - Branch_test

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latihan-lks-toko

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        # Menambahkan --ignore-platform-reqs untuk menghindari konflik versi PHP dengan composer.lock
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Docker Swarm
        run: |
          # 1. Update service di Swarm (Rolling Update)
          docker service update \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --with-registry-auth \
            lks_toko_stack_lks_toko_app
          
          # 2. Jalankan migrasi database via One-Off container
          # Nama job unik tiap eksekusi agar tidak bentrok
          docker service create --name migration_$(date +%s) \
            --restart-condition none \
            --network presensi_network \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            php artisan migrate --force
