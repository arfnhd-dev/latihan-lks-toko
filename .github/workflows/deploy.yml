name: Deploy Laravel App to Docker Swarm

on:
  push:
    branches:
      - Branch_test  # <-- Sesuaikan ke branch tempat Mas Arief bekerja (misal: main, master, atau development)

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latihan-lks-toko

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Deploy via SSH to Docker Swarm
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # 1. Login ke GHCR di dalam VPS 1 Manager agar mendapat izin menarik image terbaru
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # 2. Perintahkan Docker Swarm melakukan Rolling Update tanpa downtime ke image versi commit terbaru (${{ github.sha }})
            docker service update \
              --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --with-registry-auth \
              lks_toko_stack_lks_toko_app
            
            # 3. Jalankan migrasi database otomatis secara terpisah di dalam cluster (One-Off Job)
            # Setelah migrasi selesai, kontainer pembantu ini akan mati otomatis (clean)
            docker service create --name toko_migration_job_$(date +%s) \
              --restart-condition none \
              --network presensievent_presensi_secure_net \
              ${{ env.IMAGE_NAME }}:${{ github.sha }} \
              php artisan migrate --force