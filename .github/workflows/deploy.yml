name: Deploy Laravel App to Docker Swarm

on:
  push:
    branches:
      - Branch_test

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latihan-lks-toko
  SERVICE_NAME: lks-toko_laravel_app
  DB_HOST: 172.17.50.58
  REDIS_HOST: 172.17.50.58
  APP_URL: https://toktes.rasibintang.net.id

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo, pdo_mysql, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create .env for testing
        run: |
          cp .env.example .env 2>/dev/null || echo "APP_ENV=local" > .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "DB_HOST=172.17.50.58" >> .env
          echo "REDIS_HOST=172.17.50.58" >> .env

      - name: Run tests
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Generate APP_KEY
        id: generate_key
        run: |
          APP_KEY=$(php -r "echo 'base64:' . base64_encode(random_bytes(32));")
          echo "app_key=$APP_KEY" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_KEY=${{ steps.generate_key.outputs.app_key }}
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${{ env.APP_URL }}
            APP_FORCE_HTTPS=true
            SESSION_SECURE=true
            DB_HOST=${{ env.DB_HOST }}
            REDIS_HOST=${{ env.REDIS_HOST }}

      - name: Deploy to Docker Swarm
        run: |
          docker service update \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --with-registry-auth \
            --update-parallelism 1 \
            --update-delay 10s \
            --update-order start-first \
            --update-failure-action rollback \
            ${{ env.SERVICE_NAME }}

      - name: Wait for deployment
        run: sleep 20

      - name: Run migrations and clear cache
        run: |
          CONTAINER_ID=$(docker ps -q -f name=${{ env.SERVICE_NAME }} | head -1)
          
          # Migration
          docker exec $CONTAINER_ID php artisan migrate --force || true
          docker exec $CONTAINER_ID php artisan db:seed --force || true
          
          # Clear cache di semua container
          for CONTAINER_ID in $(docker ps -q -f name=${{ env.SERVICE_NAME }}); do
            docker exec $CONTAINER_ID php artisan config:clear || true
            docker exec $CONTAINER_ID php artisan cache:clear || true
            docker exec $CONTAINER_ID php artisan view:clear || true
            docker exec $CONTAINER_ID php artisan route:clear || true
          done

      - name: Verify deployment
        run: |
          echo "=== Service Status ==="
          docker service ps ${{ env.SERVICE_NAME }}
          
          echo -e "\n=== Health Check via Traefik (VPS5) ==="
          
          # Health check ke Traefik di VPS5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://172.17.50.59:80)
          
          if [ $HTTP_CODE -eq 200 ] || [ $HTTP_CODE -eq 301 ] || [ $HTTP_CODE -eq 302 ]; then
            echo "✅ Deployment successful! HTTP: $HTTP_CODE"
          else
            echo "❌ Deployment failed! HTTP: $HTTP_CODE"
            exit 1
          fi
